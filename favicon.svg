<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- pomozine favicon: a cut-out "P" tile, off-register pink print, masking tape -->
  <g transform="rotate(-6 32 32)">
    <!-- pink shadow tile (off-register print) -->
    <polygon points="11,11 55,9 57,55 13,57" fill="#ff2e88"/>
    <!-- black tile with slightly uneven, hand-cut edges -->
    <polygon points="6,7 51,5 50,28 52,50 7,52 8,30" fill="#141414"/>
    <!-- the P: pink misprint underneath, paper-white on top -->
    <path fill="#ff2e88" fill-rule="evenodd" transform="translate(2.5 2.5)"
      d="M17 13H33C40.5 13 45 17.8 45 24.5S40.5 36 33 36H27V46H17ZM27 21V28H32C34.6 28 35.8 26.6 35.8 24.5S34.6 21 32 21Z"/>
    <path fill="#f8f6f0" fill-rule="evenodd"
      d="M17 13H33C40.5 13 45 17.8 45 24.5S40.5 36 33 36H27V46H17ZM27 21V28H32C34.6 28 35.8 26.6 35.8 24.5S34.6 21 32 21Z"/>
  </g>
  <!-- masking tape across the corner -->
  <polygon points="40,1 60,11 56,19 36,9" fill="#f4e7a1" fill-opacity=".85"/>
</svg>
